<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (arancione bruciato) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8590C" />
      <stop offset="100%" stop-color="#C24A08" />
    </linearGradient>
    <linearGradient id="topHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5C2604" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- iOS Style Rounded App Icon Canvas -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#topHighlight)" />

  <!-- Chiave inglese stilizzata -->
  <g filter="url(#shadow)" transform="translate(256 256) rotate(45)" stroke="#FFFFFF" stroke-linecap="round">
    <rect x="-26" y="-140" width="52" height="280" rx="26" fill="#FFFFFF" />
    <circle cx="0" cy="-140" r="52" fill="none" stroke-width="30" />
    <circle cx="0" cy="140" r="40" fill="none" stroke-width="30" />
  </g>
</svg>
